function scan(){document.querySelectorAll('video.hlv').forEach(function(v){if(!v.__io){v.__io=1;io.observe(v)}})}scan();new MutationObserver(scan).observe(document.getElementById('dc-root'),{childList:true,subtree:true});})();
</script>
</body></html>
