<style>
html:root body{background-color:#ffffff!important}
/* no browser scroll anchoring on this page: rows must grow DOWN, never shove the page up */

/* Labs hero = Figma frame "The Sphere Lab" (7634 x 4578), scaled to FIT the screen like Figma does.
   Everything sits inside the site frame: min(100vw,1920px), centred (same frame as the nav).
   --s = 1 Figma unit. Horizontal anchors follow the site grid (2.8 / 26 / 30 / 49.5 / 69 / 74 / 97.2) of that frame. */

  html body .lx-rock{left:calc((100% - min(100%,1920px)) / 2 + min(100%,1920px) * 0.495 - 1507 * var(--s))!important;top:calc(469.5 * var(--s))!important;width:calc(3014 * var(--s))!important;height:calc(3767 * var(--s))!important}
  html body .lx-title{left:calc((100% - min(100%,1920px)) / 2 + min(100%,1920px) * 0.495)!important;width:auto!important;transform:translateX(-50%)!important;top:calc(2182 * var(--s))!important;font-size:calc(422.92 * var(--s))!important;line-height:calc(338.26 * var(--s))!important;text-align:center!important}

  html body .lx-copy{position:absolute!important;left:calc((100% - min(100%,1920px)) / 2 + min(100%,1920px) * 0.0576)!important;width:calc(min(100%,1920px) * 0.8855)!important;margin:0!important;top:calc(3308 * var(--s))!important;font-size:calc(297 * var(--s))!important;line-height:calc(284 * var(--s))!important;letter-spacing:-0.012em!important}

html body .lw-frame.has-cur .lw-row:not(.cur) .lw-line{opacity:.42}

html.lw-vb body .lw-slides{margin-bottom:18px}
