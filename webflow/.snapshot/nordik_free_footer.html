<!-- Same nav behaviour as the live case study page (fixed, frosted, hides on scroll down, returns on scroll up). -->
<style>
  #nav-bar-secondary{position:fixed!important;top:0;left:0;right:0;z-index:999;transform:translateY(0);transition:transform .4s cubic-bezier(.16,1,.3,1),background .4s ease,backdrop-filter .4s ease;background:rgba(229,229,229,1)!important;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
  #nav-bar-secondary.hidden-nav{transform:translateY(-100%)}
  #nav-bar-secondary.visible{transform:translateY(0)}
  #nav-bar-secondary.frosted{background:rgba(229,229,229,.6)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
</style>
<script>
(function(){
  var navbar=document.querySelector('#nav-bar-secondary');
  if(!navbar) return;
  var navHideTimer=null,lastScrollY=window.scrollY,isPastThreshold=false,SCROLL_THRESHOLD=100;
  var hoverZone=document.createElement('div');
  hoverZone.style.cssText='position:fixed;top:0;left:0;right:0;height:30px;z-index:1000;pointer-events:all;';
  document.body.appendChild(hoverZone);
  function hideNavbar(){navbar.classList.add('hidden-nav');navbar.classList.remove('visible');}
  function showNavbar(){navbar.classList.remove('hidden-nav');navbar.classList.add('visible');navbar.classList.add('frosted');clearTimeout(navHideTimer);navHideTimer=setTimeout(function(){if(isPastThreshold)hideNavbar();},8000);}
  navbar.addEventListener('mouseenter',function(){clearTimeout(navHideTimer);});
  navbar.addEventListener('mouseleave',function(){if(isPastThreshold){navHideTimer=setTimeout(hideNavbar,8000);}});
  hoverZone.addEventListener('mouseenter',function(){if(isPastThreshold)showNavbar();});
  window.addEventListener('scroll',function(){
    var y=window.scrollY;
    if(y>10){navbar.classList.add('frosted');}else{navbar.classList.remove('frosted');}
    if(y>SCROLL_THRESHOLD&&!isPastThreshold){isPastThreshold=true;hideNavbar();}
    else if(y<=SCROLL_THRESHOLD&&isPastThreshold){isPastThreshold=false;clearTimeout(navHideTimer);showNavbar();clearTimeout(navHideTimer);}
    if(y<lastScrollY&&isPastThreshold){showNavbar();}
    lastScrollY=y;
  },{passive:true});
})();
</script>

<script>
(function(){
  if(!/[?&]old\b/.test(location.search)) document.body.classList.add('cs-flow');
  var CLIENT={src:'https://cdn.prod.website-files.com/68bf9e7489e7a893477eea27/6a2af35d6a106878e6990c32_Nordik.svg',alt:'Nordik Recovery logo'};
  var ICONS='https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@latest/icons/';
  var path=location.pathname.replace('-v2','');
  var url='https://artelagency.com'+path;
  var T={
    en:{label:'Summarize with',prompt:'Summarize this case study and pull out the key results: '},
    fr:{label:'Résumer avec',prompt:'Résume cette étude de cas et fais ressortir les résultats clés : '}
  };
  var AI=[
    ['ChatGPT','https://chatgpt.com/?q=','openai'],
    ['Claude','https://claude.ai/new?q=','claude-color'],
    ['Perplexity','https://www.perplexity.ai/search/new?q=','perplexity-color'],
    ['Google AI','https://www.google.com/search?udm=50&q=','google-color'],
    ['Grok','https://grok.com/?q=','grok']
  ];
  [].forEach.call(document.querySelectorAll('.cs-container'),function(c){
    var head=c.querySelector('.cs-header');
    if(head&&!head.querySelector('.cs-client')){
      var w=document.createElement('div');w.className='cs-client';
      var im=document.createElement('img');im.src=CLIENT.src;im.alt=CLIENT.alt;im.loading='lazy';
      w.appendChild(im);head.insertBefore(w,head.firstChild);
    }
    var by=c.querySelector('.cs-byline');
    if(!by||c.querySelector('.cs-ai')) return;
    var t=T[c.getAttribute('data-lang')]||T.en;
    var q=encodeURIComponent(t.prompt+url);
    var row=document.createElement('div');
    row.className='cs-ai';
    var l=document.createElement('span');
    l.className='cs-ai-l';
    l.textContent=t.label;
    row.appendChild(l);
    AI.forEach(function(a){
      var e=document.createElement('a');
      e.href=a[1]+q;
      e.target='_blank';
      e.rel='noopener';
      var ic=document.createElement('img');
      ic.src=ICONS+a[2]+'.svg';
      ic.alt='';ic.width=16;ic.height=16;
      e.appendChild(ic);
      e.appendChild(document.createTextNode(a[0]));
      row.appendChild(e);
    });
    by.parentNode.insertBefore(row,by.nextSibling);
  });
})();
</script>
