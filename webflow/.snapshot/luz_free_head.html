<script>
/* HERO READY — wait until the hero photo has FULLY downloaded, then trigger
   the single entrance fade. Safety timeout so the page never stays hidden. */
(function(){
  function ready(){
    var h=document.documentElement;
    if(h.classList.contains('aa-bg-ready')) return;
    h.classList.add('aa-bg-ready');
    window.__aaReadyAt=(window.performance&&performance.now)?performance.now():Date.now();
  }
  function gate(){
    var bg=document.getElementById('hero-plaza-bg');
    if(!bg){ ready(); return; }
    var cs='';
    try{ cs=getComputedStyle(bg).backgroundImage||''; }catch(e){}
    var m=cs.match(/url\(("|')?([^"')]+)/);
    if(!m||!m[2]){ ready(); return; }
    var im=new Image();
    im.onload=ready; im.onerror=ready;
    im.src=m[2];
    if(im.complete) ready();
    setTimeout(ready,3500);
  }
  if(document.readyState!=='loading') gate();
  else document.addEventListener('DOMContentLoaded',gate);
})();
</script>

<script>
/* BILLBOARD MOBILE — one-sentence-per-line rebuild reusing the reveal engine's
   .rvLw/.rvL classes; locale-safe sentence split. */
(function(){
  function build(){
    if(window.innerWidth>=768) return;
    var h=document.querySelector('#clients .bb-headline'); if(!h) return;
    if(h.querySelector('.aa-bb-punch')) return;
    var src=(h.dataset&&h.dataset.rvOrig)||h.textContent||'';
    src=src.replace(/\s+/g,' ').trim(); if(!src) return;
    h.dataset.rvOrig=src;
    var parts=src.match(/[^.!?]+[.!?]+/g)||[src];
    parts=parts.map(function(s){return s.trim();}).filter(Boolean);
    if(parts.length<2) return;
    var last=parts.length-1;
    h.innerHTML=parts.map(function(s,i){
      var punch=(i===last);
      var d=(i*0.12).toFixed(2);
      var txt=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<span class="rvLw'+(punch?' aa-bb-punch':'')+'" style="display:block"><span class="rvL" style="transition:transform .95s cubic-bezier(.19,1,.22,1) '+d+'s, opacity .55s ease '+d+'s">'+txt+'</span></span>';
    }).join('');
    var bb=document.querySelector('#clients.section-9');
    function go(){ h.querySelectorAll('.rvL').forEach(function(l){ l.classList.add('go'); }); }
    if(!document.documentElement.classList.contains('rv-on')){ h.querySelectorAll('.rvL').forEach(function(l){ l.style.transition='none'; l.classList.add('go'); }); }
    else if(!bb||bb.classList.contains('rv-in')||!('IntersectionObserver'in window)){ go(); }
    else{
      var io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ setTimeout(go,250); io.disconnect(); } }); },{threshold:0.18});
      io.observe(bb);
    }
  }
  function arm(){ var n=0,iv=setInterval(function(){ build(); if(++n>20) clearInterval(iv); },400); build(); }
  if(document.readyState!=='loading') arm(); else document.addEventListener('DOMContentLoaded',arm);
  window.addEventListener('resize',function(){ setTimeout(build,350); },{passive:true});
})();
</script>
<script>
/* === SNAP-MAP REFRESHER (July 21) — keeps the wheel-paging cluster map true
   after the mission module injects ~200vh of page post-init, and re-arms
   cluster re-entry on scroll-direction reversals. Verified headless: every
   snap lands on a true section top in both scroll directions. */
(function(){
  function kick(){ try{ window.dispatchEvent(new Event('resize')); }catch(e){} }
  window.addEventListener('load', function(){ setTimeout(kick,300); });
  setTimeout(kick,2000); setTimeout(kick,4500); setTimeout(kick,8000);
  if('MutationObserver' in window){
    var t=null, mo=new MutationObserver(function(){ clearTimeout(t); t=setTimeout(kick,300); });
    (function arm(){ if(document.body){ mo.observe(document.body,{childList:true}); } else setTimeout(arm,60); })();
  }
  var last=window.pageYOffset||0, dir=0, cool=0;
  window.addEventListener('scroll', function(){
    var sc=window.pageYOffset||0, d=sc-last; last=sc;
    if(!d) return;
    var nd=d>0?1:-1;
    if(dir && nd!==dir){ var now=Date.now(); if(now-cool>900){ cool=now; kick(); } }
    dir=nd;
  }, {passive:true});
})();
</script>

<script>
/* === MOTION POLISH runtime === */
(function(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function tune(){
    var L=window.__lenis;
    if(!L){ setTimeout(tune,150); return; }
    try{ L.options.lerp=0.09; L.options.wheelMultiplier=1.0; }catch(e){}
  })();
  var eoQ=function(t){ return 1-Math.pow(1-t,4); };
  var eioQ=function(t){ return t<.5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2; };
  (function patch(){
    if(!window.Lenis||!window.Lenis.prototype){ setTimeout(patch,60); return; }
    if(window.Lenis.prototype.__aaTuned) return;
    var o=window.Lenis.prototype.scrollTo;
    window.Lenis.prototype.scrollTo=function(t,opts){
      if(opts && opts.lock && opts.force){
        if(opts.duration===0.55){ opts.duration=1.0;  opts.easing=eoQ;  }
        else if(opts.duration===0.9){ opts.duration=1.15; opts.easing=eioQ; }
      }
      return o.apply(this,arguments);
    };
    window.Lenis.prototype.__aaTuned=1;
  })();
  function arm(){
    if(!('IntersectionObserver' in window)) return;
    var picks=[];
    ['.fp-section > .fp-inner','#ai-readiness > .w-layout-blockcontainer','#cta-chatbot > .w-layout-blockcontainer',
     '#compliance > .w-layout-blockcontainer','.footer-light'].forEach(function(s){
      var el=document.querySelector(s); if(el) picks.push(el);
    });
    var abouts=document.querySelectorAll('section[id="about"]');
    if(abouts.length>1) picks.push(abouts[1]);
    if(!picks.length) return;
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('aa-in'); io.unobserve(en.target); }
      });
    },{threshold:0.12});
    picks.forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.top<innerHeight && r.bottom>0){ el.classList.add('aa-rev','aa-in'); return; }
      el.classList.add('aa-rev'); io.observe(el);
    });
  }
  if(document.readyState!=='loading'){ setTimeout(arm,600); }
  else document.addEventListener('DOMContentLoaded',function(){ setTimeout(arm,600); });
})();
</script>

<script>
/* NAV CTA v2 — injected at DOMContentLoaded BEFORE the reveal engine binds its
   navbar-link handlers (head scripts register first), so the engine's
   release-on-click and smooth anchor behavior cover this link too. The
   pre-set aa-roll class opts it out of the letter-roll rebuild.
   GATE: the pill only becomes visible once the scroll position has reached
   the work section (#aa-results) — before that (hero + billboard) it stays
   hidden even when the navbar itself shows. */
(function(){
  function place(a, nb){
    var host=nb.querySelector('.w-container')||nb;
    if(getComputedStyle(host).position==='static') host.style.position='relative';
    var links=nb.querySelectorAll('a'), lg=null;
    for(var i=0;i<links.length;i++){ if(/login/i.test((links[i].textContent||'').trim())){ lg=links[i]; break; } }
    var r=host.getBoundingClientRect();
    var right = lg ? Math.max(24, Math.round(r.right - lg.getBoundingClientRect().left) + 26) : 150;
    a.style.right = right + 'px';
    if(a.parentElement!==host) host.appendChild(a);
  }
  function gate(){
    var a=document.querySelector('.aa-nav-cta'); if(!a) return;
    var w=document.getElementById('aa-results');
    var sc=window.pageYOffset||0;
    if(!w){ a.classList.add('aa-on'); return; }
    var top=w.getBoundingClientRect().top + sc;
    a.classList.toggle('aa-on', sc >= top - 80);
  }
  function add(){
    if(window.innerWidth<992) return;
    var nb=document.querySelector('.navbar'); if(!nb) return;
    var mine=nb.querySelector('.aa-nav-cta');
    if(!mine){
      var links=nb.querySelectorAll('a[href*="ai-readiness"]');
      for(var i=0;i<links.length;i++){
        var cs=getComputedStyle(links[i]);
        if(cs.display!=='none' && cs.visibility!=='hidden') return; /* a visible CTA already exists */
      }
      mine=document.createElement('a');
      mine.className='aa-nav-cta aa-roll';
      mine.href='#ai-readiness';
      mine.textContent='Get my AIQ';
    }
    place(mine, nb);
    gate();
  }
  var tick=false;
  window.addEventListener('scroll',function(){
    if(tick) return; tick=true;
    requestAnimationFrame(function(){ tick=false; gate(); });
  },{passive:true});
  if(document.readyState!=='loading'){ add(); } else document.addEventListener('DOMContentLoaded',add);
  var n=0, iv=setInterval(function(){ add(); if(++n>8) clearInterval(iv); },800);
  window.addEventListener('resize',function(){ setTimeout(add,300); },{passive:true});
})();
</script>
<script>
/* ABOUT PARAGRAPH — measured alignment: start the "Artel was born…" text at
   exactly the navbar logo's left edge on desktop, at any viewport width.
   (The paragraph sits under layered margins/paddings, so it's aligned by
   measurement, not arithmetic; re-runs on resize.)
   NOTE: the chatbot iframe's frame cap now lives INSIDE the Luz chat embed
   itself (cta-chatbot section) — single source of truth. */
(function(){
  function align(){
    if(window.innerWidth<992) return;
    var logo=document.querySelector('.navbar .w-nav-brand')||document.querySelector('.navbar img');
    var para=document.querySelector('#about .aa-about-para')||document.querySelector('section[id="about"] .about-us.paragraph');
    if(!logo||!para) return;
    para.style.paddingLeft='';
    var cs=getComputedStyle(para);
    var pl=parseFloat(cs.paddingLeft)||0;
    var delta=logo.getBoundingClientRect().left-(para.getBoundingClientRect().left+pl);
    if(Math.abs(delta)>1) para.style.paddingLeft=(pl+delta)+'px';
  }
  if(document.readyState!=='loading'){ align(); } else document.addEventListener('DOMContentLoaded',align);
  window.addEventListener('load',function(){ setTimeout(align,250); });
  setTimeout(align,1500); setTimeout(align,3500);
  var t; window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(align,250); },{passive:true});
})();
</script>
