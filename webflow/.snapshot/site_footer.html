<script>
(function(){
  function build(){
    if(document.querySelector('.aa-ctl')) return;
    var path=location.pathname, isFR=/^\/fr-ca(\/|$)/.test(path);
    var base=isFR?(path.replace(/^\/fr-ca/,'')||'/'):path;
    var en=base, fr='/fr-ca'+(base==='/'?'':base);
    var box=document.createElement('div'); box.className='aa-ctl';
    box.innerHTML='<a href="'+en+'" class="'+(isFR?'':'on')+'">EN</a>'+
                  '<a href="'+fr+'" class="'+(isFR?'on':'')+'">FR</a>';
    document.body.appendChild(box);
  }
  document.readyState!='loading'?build():document.addEventListener('DOMContentLoaded',build);
})();
</script>
<script>
(function(){
  var navbar = document.querySelector('.navbar');
  if (!navbar) return;
  var p = location.pathname;
  var isHome = (p === '/' || p === '/fr-ca' || p === '/fr-ca/');
  var FR = /^\/fr-ca(\/|$)/.test(p);
  var base = FR ? '/fr-ca' : '';
  // (A) Section links point at the homepage sections, by LABEL, on every page:
  //     same-page anchors on the homepage, homepage + anchor elsewhere, French pages to /fr-ca.
  //     Nov 15: Results -> #aa-results (the old #case-studies / #selected-work anchors are hidden),
  //     About -> #team (#about does not exist).
  var MAP = [
    { labels:['vision'],                                 to:'vision' },
    { labels:['how','comment','process','processus'],    to:'process' },
    { labels:['results','résultats','proof','preuve'],   to:'aa-results' },
    { labels:['about','à propos'],                       to:'team' }
  ];
  navbar.querySelectorAll('a').forEach(function(a){
    var t = (a.textContent || '').trim().toLowerCase();
    if (!t) return;
    for (var i=0;i<MAP.length;i++){
      if (MAP[i].labels.some(function(l){ return t === l || t.indexOf(l) === 0; })){
        a.setAttribute('href', (isHome ? '' : base + '/') + '#' + MAP[i].to);
        break;
      }
    }
  });
  // (B) Home already runs its own navbar script — don't double up there.
  if (isHome) return;
  // (C) Scroll behavior, matched to Home: frost after 10px; hide on scroll-down,
  //     reveal on scroll-up (auto-hides after ~4s). Subpages have no hero, so use a small threshold.
  var lastY = window.pageYOffset || 0, hideTimer = null, THRESH = 120;
  function show(){
    navbar.classList.remove('hidden-nav');
    navbar.classList.add('visible','frosted');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ if ((window.pageYOffset||0) > THRESH) hide(); }, 4000);
  }
  function hide(){
    navbar.classList.add('hidden-nav');
    navbar.classList.remove('visible');
  }
  navbar.addEventListener('mouseenter', function(){ clearTimeout(hideTimer); });
  window.addEventListener('scroll', function(){
    var y = window.pageYOffset || 0;
    navbar.classList.toggle('frosted', y > 10);
    if (y > THRESH) {
      if (y < lastY - 2) show();
      else if (y > lastY + 2) { clearTimeout(hideTimer); hide(); }
    } else {
      navbar.classList.remove('hidden-nav');
      navbar.classList.add('visible');
    }
    lastY = y;
  }, { passive: true });
})();
</script>
<script>
(function(){
  function track(n,p){ try{ if(typeof gtag==='function'){ gtag('event',n,p||{}); } else if(window.dataLayer){ window.dataLayer.push(Object.assign({event:n},p||{})); } }catch(e){} }
  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('a, button, .git-btn, .air-btn') : null;
    if(!el) return;
    var href = (el.getAttribute && el.getAttribute('href')) || '';
    var txt  = (el.textContent || '').trim().toLowerCase();
    var loc  = location.pathname;
    if(/talk to us|parlez-nous/.test(txt)){
      track('contact_click', { location: loc });
    } else if(/cta-chatbot/.test(href) || /book my discovery call|réservez mon appel/.test(txt)){
      track('book_call_click', { location: loc });
    } else if(/ai-readiness/.test(href) || /get my aiq|obtenez mon aiq/.test(txt)){
      track('aiq_cta_click', { location: loc });
    }
  }, true);
})();
</script>

<script>
(function(){
  function init(){
    var body=document.body, toggle=document.querySelector('.an-toggle'), panel=document.getElementById('an-panel');
    if(!toggle||!panel) return;
    var path=location.pathname, FR=/^\/fr-ca(\/|$)/.test(path);
    var isHome=/^\/(fr-ca\/?)?$/.test(path);
    var base=FR?(path.replace(/^\/fr-ca/,'')||'/'):path;
    var home=FR?'/fr-ca/':'/';
    /* logos go home, locale-aware */
    document.querySelectorAll('.an-logo,.an-wordmark').forEach(function(a){ a.setAttribute('href',home); });
    /* section links: same-page anchors on home, home+anchor elsewhere */
    panel.querySelectorAll('.an-item').forEach(function(a){
      var lbl=a.querySelector('.an-lbl'); if(lbl) lbl.textContent=FR?a.getAttribute('data-fr'):a.getAttribute('data-en');
      if(a.getAttribute('data-id')) a.setAttribute('href',(isHome?'':home)+'#'+a.getAttribute('data-id'));
      else if(a.getAttribute('data-page')) a.setAttribute('href',(FR?'/fr-ca':'')+a.getAttribute('data-page'));
      else if(a.getAttribute('data-login')){
        var src=null, links=document.querySelectorAll('.navbar a');
        for(var i=0;i<links.length;i++){ if(/login|connexion/i.test((links[i].textContent||'').trim())){ src=links[i]; break; } }
        if(src&&src.getAttribute('href')) a.setAttribute('href',src.getAttribute('href'));
        if(src&&src.getAttribute('target')) a.setAttribute('target',src.getAttribute('target'));
      }
    });
    /* EN | FR inside the menu only */
    var en=panel.querySelector('.an-en'), fr=panel.querySelector('.an-fr');
    if(en){ en.setAttribute('href',base); en.classList.toggle('is-active',!FR); }
    if(fr){ fr.setAttribute('href','/fr-ca'+(base==='/'?'':base)); fr.classList.toggle('is-active',FR); }
    function setOpen(o){
      body.classList.toggle('an-open',o);
      toggle.setAttribute('aria-expanded',o?'true':'false');
      toggle.setAttribute('aria-label',o?'Close menu':'Open menu');
    }
    toggle.addEventListener('click',function(){ setOpen(!body.classList.contains('an-open')); });
    panel.querySelectorAll('a').forEach(function(a){ a.addEventListener('click',function(){ setOpen(false); }); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') setOpen(false); });
    window.addEventListener('resize',function(){ if(window.innerWidth>991) setOpen(false); },{passive:true});
  }
  if(document.readyState!=='loading') init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

<script>

    privacy:'Privacy policy', privUrl:'https://artelagency.com/privacy-policy',

    nec:'Necessary', necD:'Always on. Language, security and remembering your choice.',
